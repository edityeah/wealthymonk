name: Set Cloudflare Pages secrets

# One-shot (re-runnable): push runtime secrets to the Pages project so the
# contact / subscribe / unsubscribe Functions can reach Notion + Resend at the
# edge. Build-time GitHub secrets are NOT visible to Pages Functions — they need
# their own project secrets. Run from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch: {}

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-save wrangler@4
      - name: Put Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CONTACT_DB_ID: ${{ secrets.NOTION_CONTACT_DB_ID }}
          NOTION_SUBSCRIBERS_DB_ID: ${{ secrets.NOTION_SUBSCRIBERS_DB_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
        run: |
          put() { printf '%s' "$2" | npx wrangler pages secret put "$1" --project-name=wealthy-monk; }
          [ -n "$NOTION_TOKEN" ] && put NOTION_TOKEN "$NOTION_TOKEN" || echo "NOTION_TOKEN missing"
          [ -n "$NOTION_CONTACT_DB_ID" ] && put NOTION_CONTACT_DB_ID "$NOTION_CONTACT_DB_ID" || echo "NOTION_CONTACT_DB_ID missing"
          [ -n "$NOTION_SUBSCRIBERS_DB_ID" ] && put NOTION_SUBSCRIBERS_DB_ID "$NOTION_SUBSCRIBERS_DB_ID" || echo "NOTION_SUBSCRIBERS_DB_ID missing"
          [ -n "$RESEND_API_KEY" ] && put RESEND_API_KEY "$RESEND_API_KEY" || echo "RESEND_API_KEY missing (emails off)"
          [ -n "$UNSUB_SECRET" ] && put UNSUB_SECRET "$UNSUB_SECRET" || echo "UNSUB_SECRET missing (unsub links won't verify)"
          echo "Done."
