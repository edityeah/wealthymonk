name: AI blog-drafting agent

# Two market "Day Starter" briefs per day — one Indian Markets, one US Markets —
# drafted into Notion (never auto-published). The run is idempotent: it produces
# only the region(s) not yet drafted today, so hourly slots fill any gap then
# no-op. Hourly gives headroom against GitHub's scheduled-cron delays/skips.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if today already has reports'
        type: boolean
        default: false
      dry_run:
        description: 'Generate but do not write to Notion'
        type: boolean
        default: false

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the agent
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          AGENT_FORCE: ${{ inputs.force && '1' || '' }}
          AGENT_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: npm run agent
