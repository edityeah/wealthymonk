name: AI blog-drafting agent

# Hourly → up to 24 run-slots/day, one draft each. The planner caps daily
# output at 10 (3 evergreen + 7 news) from Notion state; extra slots no-op.
# Hourly gives headroom against GitHub's scheduled-cron delays/skips.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the agent
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          AGENT_EVERGREEN_PER_DAY: '3'
          AGENT_NEWS_PER_DAY: '7'
        run: npm run agent
